<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopping Agent</title>
<style>
  :root {
    --bg: #16110a;
    --panel: #1e1710;
    --panel-2: #261d13;
    --border: #3d2f1c;
    --border-soft: #2e2416;
    --text: #f3ead9;
    --text-dim: #b09d81;
    --text-faint: #75634a;
    --accent: #c98a3f;
    --accent-2: #a8672a;
    --accent-soft: rgba(201, 138, 63, 0.16);
    --accent-dim: #40300f;
    --user-bubble: linear-gradient(135deg, #c98a3f, #a8672a);
    --agent-bubble: #261d13;
    --card: #221a10;
    --success: #8faa5d;
    --warn: #d9a441;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-soft: 0 6px 20px rgba(0,0,0,0.4);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-size: 14.5px;
  }
  #app {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: 100vh;
  }

  /* Sidebar */
  #sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border-soft);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }
  .brand-box {
    background: linear-gradient(155deg, var(--accent-dim), var(--panel-2));
    border: 1.5px dashed var(--accent);
    border-radius: var(--radius-md);
    padding: 18px 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .brand-box::before {
    content: "";
    position: absolute;
    top: 50%;
    left: -25%;
    transform: translateY(-50%);
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, rgba(232,163,61,0.28), transparent 70%);
    pointer-events: none;
  }
  .brand-eyebrow {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }
  #sidebar h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    position: relative;
  }
  .sidebar-bottom {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #newSessionBtn {
    width: 100%;
    border: none;
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-family: inherit;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b0d11;
    box-shadow: var(--shadow-soft);
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  #newSessionBtn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  #newSessionBtn:active { transform: translateY(0); }

  .profile-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.7;
  }
  .profile-box b { color: var(--text); font-weight: 600; }
  .tag {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 500;
    margin: 4px 4px 0 0;
  }

  #turnMeter {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  #turnBar {
    flex: 1;
    height: 6px;
    background: var(--panel-2);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #turnBarFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 6px;
    transition: width 0.3s ease;
  }

  /* Main column */
  #main {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg);
  }
  #chatHeader {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #chatHeader .name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  #chatHeader .status {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 4px rgba(62,207,142,0.14);
  }

  #chatLog {
    flex: 1;
    overflow-y: auto;
    padding: 26px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-faint);
    max-width: 280px;
  }
  .empty-state .icon {
    font-size: 32px;
    margin-bottom: 12px;
    opacity: 0.7;
  }
  .empty-state .title {
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .empty-state .sub {
    font-size: 12.5px;
    line-height: 1.6;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.agent { justify-content: flex-start; }
  .bubble {
    max-width: 64%;
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: #0b0d11;
    font-weight: 500;
    border-bottom-right-radius: 6px;
  }
  .row.agent .bubble {
    background: var(--agent-bubble);
    color: var(--text);
    border: 1px solid var(--border-soft);
    border-bottom-left-radius: 6px;
  }
  .agent-block { display: flex; flex-direction: column; gap: 10px; max-width: 76%; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    align-self: flex-start;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 11px;
    border-radius: 20px;
    letter-spacing: 0.01em;
  }

  .recs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 2px;
  }
  .rec-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .rec-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.3);
  }
  .rec-card.is-target {
    border-color: var(--success);
    box-shadow: 0 0 0 1px var(--success);
  }
  .rec-card.is-target .rank { background: rgba(143,170,93,0.18); color: var(--success); }
  .rec-card .rank {
    display: inline-block;
    font-size: 10.5px;
    color: var(--accent);
    background: var(--accent-soft);
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .rec-card .title {
    font-size: 12.3px;
    color: var(--text);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .rec-card .meta {
    margin-top: 7px;
    font-size: 10.8px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .rec-card .price { color: var(--success); font-weight: 600; }

  .system-note {
    align-self: center;
    font-size: 11.5px;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 15px;
    max-width: 80%;
    text-align: center;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .hit-banner {
    align-self: center;
    background: rgba(143,170,93,0.14);
    border: 1px solid var(--success);
    color: var(--success);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 12.5px;
    font-weight: 700;
    text-align: center;
    max-width: 85%;
  }

  /* Dev-testing additions: sample/agent pickers, target reveal, autoplay */
  .field-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin-bottom: 6px;
    font-weight: 700;
  }
  select {
    width: 100%;
    font-family: inherit;
    font-size: 12.5px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 10px;
  }
  select:disabled { opacity: 0.5; }
  .target-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 11.5px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .target-box b { color: var(--success); }
  .agent-note {
    font-size: 11px;
    color: var(--text-faint);
    line-height: 1.5;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  #autoplayBtn {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    font-family: inherit;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
  }
  #autoplayBtn:hover { background: var(--accent-soft); }
  #autoplayBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  .transcript-summary {
    align-self: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 18px;
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.7;
    max-width: 90%;
    text-align: center;
  }
  .transcript-summary b { color: var(--text); }
  .transcript-summary.hit { border-color: var(--success); }
  .transcript-summary.hit b.hit-flag { color: var(--success); }
  .transcript-summary.miss b.hit-flag { color: var(--warn); }

  #composer {
    border-top: 1px solid var(--border-soft);
    padding: 16px 28px 22px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #msgInput {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 13px 18px;
    outline: none;
    font-size: 14px;
    transition: border-color 0.15s ease;
  }
  #msgInput:focus { border-color: var(--accent); }
  #msgInput::placeholder { color: var(--text-faint); }
  #sendBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b0d11;
    border: none;
    border-radius: 999px;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  #sendBtn:disabled { opacity: 0.35; cursor: not-allowed; filter: none; }
  #msgInput:disabled { opacity: 0.6; cursor: not-allowed; }
  #sendBtn:not(:disabled):hover { filter: brightness(1.08); transform: translateY(-1px); }

  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  #chatLog::-webkit-scrollbar, #sidebar::-webkit-scrollbar { width: 8px; }
  #chatLog::-webkit-scrollbar-thumb, #sidebar::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 8px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand-box">
      <h1>Shopping Agent</h1>
    </div>

    <div class="sidebar-bottom">
      <div>
        <div class="field-label">Test profile</div>
        <select id="sampleSelect"><option value="">Random / default profile</option></select>
      </div>

      <div>
        <div class="field-label">Agent</div>
        <select id="agentSelect"></select>
        <div id="agentNote" class="agent-note"></div>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="alwaysRecommendChk" />
        Always show top 10 (demo only, costs MRR)
      </label>

      <div>
        <div class="field-label">Question strategy (demo only)</div>
        <select id="policySelect">
          <option value="other">other (shipped / highest score)</option>
          <option value="split">split (information-gain pick)</option>
          <option value="rotate">rotate (cycle attributes)</option>
        </select>
      </div>

      <button id="newSessionBtn">Start new session (manual chat)</button>
      <button id="autoplayBtn" disabled title="Pick a test profile above to enable">Auto-play this profile (scored transcript)</button>

      <div id="profileBox" class="profile-box">No active session.</div>
      <div id="targetBox" class="target-box" style="display:none;"></div>

      <div id="turnMeter">
        <span id="turnLabel">Turn 0/10</span>
        <div id="turnBar"><div id="turnBarFill"></div></div>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="chatHeader">
      <div class="name">Session <span id="sessionIdLabel">—</span></div>
      <div class="status"><span class="dot"></span><span id="statusLabel">Ready</span></div>
    </div>
    <div id="chatLog">
      <div class="empty-state" id="emptyState">
        <div class="icon">🏷️</div>
        <div class="title">No active session</div>
        <div class="sub">Click "Start new session" to begin chatting with the shopping agent.</div>
      </div>
    </div>
    <div id="composer">
      <input id="msgInput" type="text" placeholder="Describe what you're shopping for…" disabled />
      <button id="sendBtn" disabled aria-label="Send message">➤</button>
    </div>
  </div>
</div>

<script>
const chatLog = document.getElementById('chatLog');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const newSessionBtn = document.getElementById('newSessionBtn');
const profileBox = document.getElementById('profileBox');
const turnLabel = document.getElementById('turnLabel');
const turnBarFill = document.getElementById('turnBarFill');
const sessionIdLabel = document.getElementById('sessionIdLabel');
const statusLabel = document.getElementById('statusLabel');
const sampleSelect = document.getElementById('sampleSelect');
const agentSelect = document.getElementById('agentSelect');
const agentNote = document.getElementById('agentNote');
const alwaysRecommendChk = document.getElementById('alwaysRecommendChk');
const policySelect = document.getElementById('policySelect');
const autoplayBtn = document.getElementById('autoplayBtn');
const targetBox = document.getElementById('targetBox');

let sessionId = null;
let ended = false;

function currentOptions() {
  return {
    ask_policy: policySelect.value,
    always_recommend: alwaysRecommendChk.checked,
  };
}

function showTarget(target) {
  if (!target) {
    targetBox.style.display = 'none';
    targetBox.innerHTML = '';
    return;
  }
  targetBox.style.display = 'block';
  targetBox.innerHTML =
    '<b>\u{1F3AF} Real target (public set):</b><br>' +
    target.parent_asin + '<br>' + (target.title || '').slice(0, 100);
}

async function loadSamples() {
  const res = await fetch('/api/samples');
  const data = await res.json();
  (data.samples || []).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.sample_id;
    opt.textContent = s.sample_id + '  (' + s.scenario_type + ', ' + s.difficulty_bucket + ')';
    sampleSelect.appendChild(opt);
  });
}

async function loadAgents() {
  const res = await fetch('/api/agents');
  const data = await res.json();
  agentSelect.innerHTML = '';
  (data.agents || []).forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.id;
    opt.textContent = a.label + (a.available ? '' : '  (unavailable)');
    opt.disabled = !a.available;
    agentSelect.appendChild(opt);
  });
  agentSelect.addEventListener('change', () => {
    const a = (data.agents || []).find(x => x.id === agentSelect.value);
    agentNote.textContent = a ? a.detail : '';
  });
  if (agentSelect.options.length) {
    agentSelect.selectedIndex = 0;
    agentNote.textContent = data.agents[0].detail;
  }
}

sampleSelect.addEventListener('change', () => {
  autoplayBtn.disabled = !sampleSelect.value;
  autoplayBtn.title = sampleSelect.value ? '' : 'Pick a test profile above to enable';
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function scrollToBottom() { chatLog.scrollTop = chatLog.scrollHeight; }

function addUserMessage(text) {
  const row = el('div', 'row user');
  row.appendChild(el('div', 'bubble', text));
  chatLog.appendChild(row);
  scrollToBottom();
}

function addSystemNote(text) {
  chatLog.appendChild(el('div', 'system-note', text));
  scrollToBottom();
}

function addTypingIndicator() {
  const row = el('div', 'row agent');
  row.id = 'typingRow';
  const bubble = el('div', 'bubble');
  const t = el('div', 'typing');
  t.appendChild(el('span')); t.appendChild(el('span')); t.appendChild(el('span'));
  bubble.appendChild(t);
  row.appendChild(bubble);
  chatLog.appendChild(row);
  scrollToBottom();
}

function removeTypingIndicator() {
  const row = document.getElementById('typingRow');
  if (row) row.remove();
}

function fmtPrice(p) {
  if (p === null || p === undefined || p === '') return null;
  return '$' + Number(p).toFixed(2);
}

function addHitBanner(rank, turn) {
  chatLog.appendChild(el('div', 'hit-banner',
    '\u{1F3AF} Real hit at rank #' + rank + ', turn ' + turn + ' — session ends here in real scoring.'));
  scrollToBottom();
}

function addAgentTurn(data) {
  const row = el('div', 'row agent');
  const block = el('div', 'agent-block');

  block.appendChild(el('div', 'bubble', data.message || '(no message)'));

  if (data.ask_attribute) {
    block.appendChild(el('div', 'chip', '❓ asking about: ' + data.ask_attribute));
  }

  if (data.withheld) {
    block.appendChild(el('div', 'chip', '⏸️ No list this turn — on purpose (protecting MRR until confident)'));
  } else if (data.recommendations && data.recommendations.length) {
    const grid = el('div', 'recs');
    data.recommendations.forEach((rec, i) => {
      const card = el('div', rec.is_target ? 'rec-card is-target' : 'rec-card');
      card.appendChild(el('div', 'rank', (rec.is_target ? '\u{1F3AF} ' : '') + '#' + (i + 1)));
      card.appendChild(el('div', 'title', rec.title || '(untitled)'));
      const meta = el('div', 'meta');
      const price = fmtPrice(rec.price);
      meta.appendChild(el('span', null, rec.store || ''));
      if (price) meta.appendChild(el('span', 'price', price));
      card.appendChild(meta);
      grid.appendChild(card);
    });
    block.appendChild(grid);
  }

  row.appendChild(block);
  chatLog.appendChild(row);
  scrollToBottom();
}

function renderProfile(p) {
  p = p || {};
  const tags = (p.preference_tags || []).map(t => '<span class="tag">' + t + '</span>').join('');
  profileBox.innerHTML =
    '<b>Purchases:</b> ' + (p.purchase_frequency || '—') + '<br>' +
    '<b>Rating style:</b> ' + (p.rating_style || '—') + '<br>' +
    '<b>Summary:</b> ' + (p.summary || '—') +
    (tags ? '<br><br>' + tags : '');
}

async function startSession() {
  chatLog.innerHTML = '';
  ended = false;
  statusLabel.textContent = 'Starting…';
  const res = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      sample_id: sampleSelect.value || null,
      agent: agentSelect.value || 'rules',
      options: currentOptions(),
    }),
  });
  const data = await res.json();
  if (data.error) {
    statusLabel.textContent = 'Error';
    addSystemNote('Error: ' + data.error);
    return;
  }
  sessionId = data.session_id;
  sessionIdLabel.textContent = sessionId;
  statusLabel.textContent = 'Ready — ' + (data.agent_label || data.agent);

  renderProfile(data.profile);
  showTarget(data.target);

  turnLabel.textContent = 'Turn 0/10';
  turnBarFill.style.width = '0%';

  msgInput.disabled = false;
  sendBtn.disabled = false;
  msgInput.focus();

  addSystemNote('New session started with ' + (data.agent_label || data.agent) +
    (data.sample_id ? ', profile ' + data.sample_id + '. Real target revealed in the sidebar.' : ', default profile.'));
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || !sessionId || ended) return;
  addUserMessage(text);
  msgInput.value = '';
  msgInput.disabled = true;
  sendBtn.disabled = true;
  addTypingIndicator();

  try {
    const res = await fetch('/api/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const data = await res.json();
    removeTypingIndicator();

    if (data.error) {
      addSystemNote('Error: ' + data.error);
    } else {
      addAgentTurn(data);
      turnLabel.textContent = 'Turn ' + data.turn + '/' + data.max_turns;
      turnBarFill.style.width = Math.min(100, (data.turn / data.max_turns) * 100) + '%';
      if (data.hit) {
        addHitBanner(data.hit_rank, data.turn);
        ended = true;
      } else if (data.ended) {
        ended = true;
        if (data.has_target) {
          addSystemNote('Reached turn 10 without hitting the real target — this session would score a miss.');
        }
      }
    }
  } catch (e) {
    removeTypingIndicator();
    addSystemNote('Request failed: ' + e);
  }

  if (!ended) {
    msgInput.disabled = false;
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

async function runAutoplay() {
  const sampleId = sampleSelect.value;
  if (!sampleId) return;
  chatLog.innerHTML = '';
  ended = true; // auto-play is a read-only replay, not an interactive session
  sessionId = null;
  statusLabel.textContent = 'Running auto-play…';
  msgInput.disabled = true;
  sendBtn.disabled = true;

  const res = await fetch('/api/autoplay', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      sample_id: sampleId,
      agent: agentSelect.value || 'rules',
      options: currentOptions(),
    }),
  });
  const data = await res.json();
  if (data.error) {
    addSystemNote('Error: ' + data.error);
    statusLabel.textContent = 'Error';
    return;
  }

  sessionIdLabel.textContent = data.sample_id + ' (auto-play)';
  statusLabel.textContent = 'Auto-play — ' + (data.agent_label || data.agent);
  renderProfile(data.profile);
  showTarget(data.target);

  addSystemNote('Auto-play: the evaluator\'s own scripted customer, driving ' +
    (data.agent_label || data.agent) + ' on ' + data.sample_id +
    ' (' + data.scenario_type + ', ' + data.difficulty_bucket + ').');

  data.turns.forEach(turn => {
    addUserMessage(turn.user);
    addAgentTurn(turn);
    const targetIdx = turn.recommendations.findIndex(r => r.is_target);
    if (turn.scored_hit) {
      addHitBanner(targetIdx + 1, turn.turn);
    } else if (turn.override_pending && targetIdx !== -1) {
      addSystemNote('Target is already in the list, but this is an intent-override session — ' +
        'the evaluator won\'t count a hit until the override fires on a later turn.');
    }
  });

  turnLabel.textContent = 'Turn ' + data.turns.length + '/10';
  turnBarFill.style.width = Math.min(100, (data.turns.length / 10) * 100) + '%';

  const verdict = data.hit
    ? '<b class="hit-flag">HIT</b> at turn <b>' + data.hit_turn + '</b>, rank <b>#' + data.hit_rank +
      '</b> (reciprocal rank ' + data.reciprocal_rank + ')'
    : '<b class="hit-flag">MISS</b> — target never reached in 10 turns';
  const summary = el('div', 'transcript-summary' + (data.hit ? ' hit' : ' miss'));
  summary.innerHTML = 'Auto-play finished — ' + verdict;
  chatLog.appendChild(summary);
  scrollToBottom();
}

newSessionBtn.addEventListener('click', startSession);
sendBtn.addEventListener('click', sendMessage);
autoplayBtn.addEventListener('click', runAutoplay);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.keyCode === 13) {
    e.preventDefault();
    sendMessage();
  }
});

loadSamples();
loadAgents();
</script>
</body>
